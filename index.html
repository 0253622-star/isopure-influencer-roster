<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISOPURE · Influencer Roster · Valeria Martínez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="data.js"></script>
  <script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;
const ISOPURE_LOGO = "https://tukuz.com/wp-content/uploads/2020/02/isopure-logo-vector.png";
function formatFollowers(n){if(n>=1000000)return(n/1000000).toFixed(n>=10000000?0:1).replace(/\.0$/,"")+"M";if(n>=1000)return(n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,"")+"K";return n.toString();}
function initials(name){if(!name)return"??";const p=name.trim().split(/\s+/);if(p.length===1)return p[0].slice(0,2).toUpperCase();return(p[0][0]+p[p.length-1][0]).toUpperCase();}
function archetypeLabel(gender,key){const list=window.ARCHETYPES[gender]||[];return(list.find(a=>a.key===key)||{}).name||key;}
const PHOTO_STORE_KEY="isopure_influencer_photos_v1";
function getStoredPhotos(){try{return JSON.parse(localStorage.getItem(PHOTO_STORE_KEY)||"{}");}catch(_){return{};}}
function setStoredPhoto(username,dataUrl){const store=getStoredPhotos();if(dataUrl)store[username]=dataUrl;else delete store[username];try{localStorage.setItem(PHOTO_STORE_KEY,JSON.stringify(store));return true;}catch(e){alert("Sin espacio para más fotos.");return false;}}
async function fileToCompressedDataUrl(file,maxDim=480,quality=0.82){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("No se pudo leer el archivo"));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("No es una imagen válida"));img.onload=()=>{const scale=Math.min(1,maxDim/Math.max(img.width,img.height));const w=Math.round(img.width*scale),h=Math.round(img.height*scale);const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",quality));};img.src=reader.result;};reader.readAsDataURL(file);});}
function Header({totalCount,womenCount,menCount,onRefresh,refreshing,onDiagnose}){return(<header className="top"><div className="top-inner"><div className="brand"><img src={ISOPURE_LOGO} alt="ISOPURE" onError={(e)=>{e.target.style.display='none';}}/><div className="brand-divider"/><div className="brand-meta"><span className="top-label">Influencer Database</span><span className="top-title">Valeria Martínez · Influencer Management</span></div></div><div className="top-right"><div className="top-stat"><span className="n">{totalCount}</span><span className="l">Perfiles</span></div><div className="top-stat"><span className="n" style={{color:"var(--women-deep)"}}>{womenCount}</span><span className="l">Mujeres</span></div><div className="top-stat"><span className="n" style={{color:"var(--men)"}}>{menCount}</span><span className="l">Hombres</span></div><button className="btn-secondary" onClick={onDiagnose}>Diagnóstico</button><button className={`refresh ${refreshing?"spinning":""}`} onClick={onRefresh}>{refreshing?"Sincronizando…":"Actualizar"}</button></div></div></header>);}
function Hero(){return(<section className="hero"><div className="crumbs"><span>ISOPURE</span><span className="dot"/><span>Mercado MX</span><span className="dot"/><span>Presentación de talento</span></div><h1>Influencer roster para <span className="accent-women">ISOPURE</span> México</h1><p>Base de talento segmentada por arquetipo de comunicación.</p><div className="preview-note"><span>Si los links a Instagram no abren, usa el botón ↗ para abrir en pestaña nueva.</span></div></section>);}
function GenderToggle({selected,onChange,counts}){const items=[{key:"all",label:"Todos",n:counts.all},{key:"F",label:"Mujeres",n:counts.F},{key:"M",label:"Hombres",n:counts.M}];return(<div className="gender-toggle">{items.map(it=>(<button key={it.key} className="gender-pill" data-key={it.key} data-active={selected===it.key} onClick={()=>onChange(it.key)}><span>{it.label}</span><span className="count">{it.n}</span></button>))}</div>);}
function ArchetypeTabs({gender,selected,onSelect,countsByArchetype}){const tabs=useMemo(()=>{if(gender==="F")return window.ARCHETYPES.F.map(a=>({...a,gender:"F"}));if(gender==="M")return window.ARCHETYPES.M.map(a=>({...a,gender:"M"}));const merged=[];window.ARCHETYPES.F.forEach(a=>merged.push({...a,gender:"F",key:"F:"+a.key}));window.ARCHETYPES.M.forEach(a=>merged.push({...a,gender:"M",key:"M:"+a.key}));return merged;},[gender]);return(<div className="tabs-bar"><div className="tabs"><button className="tab" data-active={selected==="all"} onClick={()=>onSelect("all")}>Todos los arquetipos<span className="tab-count">{countsByArchetype.__total||0}</span></button>{tabs.map(t=>(<button key={t.key} className="tab" data-active={selected===t.key} data-gender={t.gender} onClick={()=>onSelect(t.key)}>{t.name}<span className="tab-count">{countsByArchetype[t.key]||0}</span></button>))}</div></div>);}
function ArchetypeIntro({gender,archetypeKey}){if(archetypeKey==="all")return null;let g=gender,k=archetypeKey;if(archetypeKey.includes(":")){[g,k]=archetypeKey.split(":");}const arche=(window.ARCHETYPES[g]||[]).find(a=>a.key===k);if(!arche)return null;return(<section className="arche-intro"><div className="arche-badge" data-gender={g}>{arche.name.replace(/^The /i,"").split(" ").map(w=>w[0]).join("").slice(0,2)}</div><div className="arche-text"><div className="who">{g==="F"?"Arquetipo · Mujeres":"Arquetipo · Hombres"}</div><h2>{arche.name}</h2><p>{arche.who}</p><div className="role-line">{arche.role.map((r,i)=><span key={i}>{r}</span>)}</div></div></section>);}
function CityFilter({selected,onChange,counts}){const cities=["Ciudad de México","Monterrey","Guadalajara"];return(<div className="city-filter"><div className="city-filter-label">Ciudad</div><div className="city-pills"><button className="city-pill" data-active={selected==="all"} onClick={()=>onChange("all")}>Todas<span className="city-count">{counts.all||0}</span></button>{cities.map(c=>(<button key={c} className="city-pill" data-active={selected===c} data-empty={(counts[c]||0)===0} onClick={()=>onChange(c)}>{c}<span className="city-count">{counts[c]||0}</span></button>))}</div></div>);}
function Toolbar({search,onSearch,visibleCount,totalCount}){return(<div className="toolbar"><div className="search"><input type="text" placeholder="Buscar por nombre o @usuario…" value={search} onChange={(e)=>onSearch(e.target.value)}/></div><div className="toolbar-meta">Mostrando <b>{visibleCount}</b> de <b>{totalCount}</b></div></div>);}
function InfluencerCard({inf,storedPhoto,onPhotoChange}){const archeName=archetypeLabel(inf.gender,inf.archetype);const url=inf.url||`https://instagram.com/${inf.username}`;const[dragOver,setDragOver]=React.useState(false);const[uploading,setUploading]=React.useState(false);const[copied,setCopied]=React.useState(false);const fileInputRef=React.useRef(null);const photoSrc=(inf.photo&&inf.photo.startsWith("http"))?inf.photo:storedPhoto;const handleFile=async(file)=>{if(!file||!file.type.startsWith("image/"))return;setUploading(true);try{const dataUrl=await fileToCompressedDataUrl(file);if(setStoredPhoto(inf.username,dataUrl))onPhotoChange(inf.username,dataUrl);}catch(e){alert("Error: "+e.message);}finally{setUploading(false);}};const copyLink=(e)=>{e.preventDefault();e.stopPropagation();navigator.clipboard.writeText(url).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1600);}).catch(()=>{const ta=document.createElement("textarea");ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);setCopied(true);setTimeout(()=>setCopied(false),1600);});};return(<div className="card"><div className={`card-photo ${dragOver?"drag-over":""} ${photoSrc?"has-photo":""}`} data-gender={inf.gender} onDragOver={(e)=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={(e)=>{e.preventDefault();e.stopPropagation();setDragOver(false);const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFile(f);}} onClick={()=>fileInputRef.current&&fileInputRef.current.click()}>{photoSrc?<img src={photoSrc} alt={inf.name} className="card-photo-img"/>:<span className="initials">{initials(inf.name)}</span>}<input ref={fileInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={(e)=>handleFile(e.target.files[0])} onClick={(e)=>e.stopPropagation()}/>{uploading&&<div className="upload-overlay"><div className="spinner-sm"/></div>}{dragOver&&<div className="drop-overlay">Soltar para añadir foto</div>}{!photoSrc&&!uploading&&!dragOver&&<div className="photo-hint"><span>Arrastra una foto</span></div>}{photoSrc&&storedPhoto&&<button className="photo-remove" onClick={(e)=>{e.stopPropagation();if(confirm("¿Quitar la foto de "+inf.name+"?")){setStoredPhoto(inf.username,null);onPhotoChange(inf.username,null);}}} title="Quitar foto">×</button>}<span className="card-badge">{archeName}</span><span className="card-followers">{formatFollowers(inf.followers)}</span></div><div className="card-body"><div className="card-name">{inf.name}</div><a className="card-handle" href={url} target="_blank" rel="noopener noreferrer" onClick={(e)=>e.stopPropagation()}>@{inf.username}</a><div className="card-meta">{inf.city&&<span className="card-tag city">{inf.city}</span>}<span className="card-tag">{formatFollowers(inf.followers)} seguidores</span></div><div className="card-actions"><a className="card-cta" href={url} target="_blank" rel="noopener noreferrer" onClick={(e)=>{e.preventDefault();e.stopPropagation();const w=window.open(url,"_blank","noopener,noreferrer");if(!w){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";document.body.appendChild(a);a.click();a.remove();}}}>Ver en Instagram</a><button className={`card-copy ${copied?"copied":""}`} onClick={copyLink} title="Copiar enlace">{copied?"✓":"📋"}</button></div></div></div>);}
function DiagnosticPanel({diag,onClose}){if(!diag)return null;return(<div className="diag-overlay" onClick={onClose}><div className="diag" onClick={(e)=>e.stopPropagation()}><div className="diag-head"><h2>Diagnóstico</h2><button className="diag-close" onClick={onClose}>×</button></div><div className="diag-body"><div className="diag-row">Sheet ID: {diag.sheetId}</div><div className="diag-row">Método: {diag.discoveryMethod}</div>{diag.error&&<div className="diag-row bad">{diag.error}</div>}<div className="diag-raw">{diag.rawText||"(sin respuesta)"}</div></div></div></div>);}
function Footer(){return(<footer className="foot"><div><h4>Estructura del Google Sheet</h4><p>Columnas: Nombre · Username · URL · Followers · Género · Arquetipo · Ciudad</p></div><div><h4>Cómo actualizar</h4><p>1. Agrega filas en tu sheet.<br/>2. Comparte con "Cualquiera con el enlace".<br/>3. Da clic en Actualizar.</p><p style={{color:"var(--ink-3)",marginTop:14}}>Valeria Martínez · 2026</p></div></footer>);}
function App(){const[data,setData]=useState([]);const[loading,setLoading]=useState(true);const[sheetError,setSheetError]=useState(null);const[usingSample,setUsingSample]=useState(false);const[gender,setGender]=useState("F");const[showDiag,setShowDiag]=useState(false);const[diag,setDiag]=useState(null);const[photoMap,setPhotoMap]=useState(()=>getStoredPhotos());const[archetype,setArchetype]=useState("all");const[city,setCity]=useState("all");const[search,setSearch]=useState("");const onPhotoChange=useCallback((username,dataUrl)=>{setPhotoMap(prev=>{const next={...prev};if(dataUrl)next[username]=dataUrl;else delete next[username];return next;});},[]);const loadData=useCallback(async()=>{setLoading(true);setSheetError(null);try{const rows=await window.fetchSheet();setDiag(window.LAST_DIAG);if(rows.length===0){setData(window.SAMPLE_INFLUENCERS);setUsingSample(true);setSheetError("El sheet se conectó pero ninguna fila se reconoció.");}else{setData(rows);setUsingSample(false);}}catch(err){setDiag(window.LAST_DIAG||{error:err.message,sheetId:window.SHEET_ID});setData(window.SAMPLE_INFLUENCERS);setUsingSample(true);setSheetError(err.message||"Error desconocido");}finally{setLoading(false);}},[]);useEffect(()=>{loadData();},[loadData]);useEffect(()=>{setArchetype("all");},[gender]);const countsByGender=useMemo(()=>({all:data.length,F:data.filter(d=>d.gender==="F").length,M:data.filter(d=>d.gender==="M").length}),[data]);const countsByArchetype=useMemo(()=>{const c={__total:0};data.forEach(d=>{if(gender!=="all"&&d.gender!==gender)return;c.__total++;const key=gender==="all"?`${d.gender}:${d.archetype}`:d.archetype;c[key]=(c[key]||0)+1;});return c;},[data,gender]);const countsByCity=useMemo(()=>{const c={all:0};data.forEach(d=>{if(gender!=="all"&&d.gender!==gender)return;if(archetype!=="all"){if(archetype.includes(":")){const[g,k]=archetype.split(":");if(d.gender!==g||d.archetype!==k)return;}else if(d.archetype!==archetype)return;}c.all++;if(d.city)c[d.city]=(c[d.city]||0)+1;});return c;},[data,gender,archetype]);const visible=useMemo(()=>{let rows=data.slice();if(gender!=="all")rows=rows.filter(d=>d.gender===gender);if(archetype!=="all"){if(archetype.includes(":")){const[g,k]=archetype.split(":");rows=rows.filter(d=>d.gender===g&&d.archetype===k);}else rows=rows.filter(d=>d.archetype===archetype);}if(city!=="all")rows=rows.filter(d=>(d.city||"").trim()===city);if(search.trim()){const q=search.trim().toLowerCase();rows=rows.filter(d=>(d.name||"").toLowerCase().includes(q)||(d.username||"").toLowerCase().includes(q));}rows.sort((a,b)=>(b.followers||0)-(a.followers||0));return rows;},[data,gender,archetype,city,search]);return(<><Header totalCount={countsByGender.all} womenCount={countsByGender.F} menCount={countsByGender.M} onRefresh={loadData} refreshing={loading} onDiagnose={()=>setShowDiag(true)}/>{showDiag&&<DiagnosticPanel diag={diag} onClose={()=>setShowDiag(false)}/>}<Hero/><GenderToggle selected={gender} onChange={setGender} counts={countsByGender}/><ArchetypeTabs gender={gender} selected={archetype} onSelect={setArchetype} countsByArchetype={countsByArchetype}/><CityFilter selected={city} onChange={setCity} counts={countsByCity}/><Toolbar search={search} onSearch={setSearch} visibleCount={visible.length} totalCount={countsByArchetype.__total||0}/>{usingSample&&sheetError&&<div className="state" style={{paddingTop:40,paddingBottom:20}}><h3>No pude leer tu Google Sheet</h3><p>{sheetError}</p><p style={{marginTop:16}}><button className="refresh" style={{display:"inline-flex"}} onClick={loadData}>Reintentar</button></p><p style={{color:"var(--ink-3)",marginTop:14,fontSize:13}}>Mientras tanto se muestran datos de ejemplo.</p></div>}<ArchetypeIntro gender={gender} archetypeKey={archetype}/>{loading&&data.length===0?<div className="state"><div className="spinner"/><p>Sincronizando con Google Sheets…</p></div>:visible.length===0?<div className="state"><h3>Sin perfiles en esta vista</h3><p>Prueba ajustar los filtros.</p></div>:<main className="grid">{visible.map((inf,i)=><InfluencerCard key={`${inf.username}-${i}`} inf={inf} storedPhoto={photoMap[inf.username]} onPhotoChange={onPhotoChange}/>)}</main>}<Footer/></>);}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
